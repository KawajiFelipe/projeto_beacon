services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - "8081:8080"  # Porta 8081 para não conflitar com a 8080 do Hop
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mapeie o caminho absoluto da pasta do Hop no host para acessar os arquivos .hpl/.hwf
      - /caminho/absoluto/no/host/hop-config:/files
      - /usr/bin/docker:/usr/bin/docker  # <--- Adicione esta linha
    networks:
      - hop-jenkins-net
    restart: unless-stopped

volumes:
  jenkins_data:

networks:
  hop-jenkins-net:
    external: true